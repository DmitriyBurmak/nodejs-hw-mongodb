type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    type: string
    example: '+380501234568'
  email:
    type: string
    format: email
    example: john.doe@example.com
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: ['work', 'home', 'personal']
    example: personal
  userId:
    description: "Contact's owner id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
