type: object
properties:
  name:
    type: string
    example: Jane Doe
  phoneNumber:
    type: string
    example: '+380501234568'
  email:
    type: string
    format: email
    example: jane.doe@example.com
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: ['work', 'home', 'personal']
    example: personal
  photo:
    type: string
    format: binary
    description: The contact's new photo file.
