summary: Log in a user
operationId: loginUser
tags:
  - Auth
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/AuthRequest.yaml'
responses:
  '200':
    description: User logged in successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Login successful!
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Invalid credentials
